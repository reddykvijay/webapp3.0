<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0c1218;--panel:#131b24;--panel2:#18222d;--line:#243242;--line2:#2f4256;--text:#dce6f0;--muted:#8a9db2;--faint:#5f7288;

  --info:#5aa9ff;--infobg:rgba(90,169,255,.15);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.45}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-h h2{margin:0;font-size:15px;font-weight:600}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:500 13px 'Archivo',sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--info)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--info);border-color:var(--info);color:#06121f}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.btn-danger{background:var(--critbg);border-color:var(--crit);color:var(--crit)}
.btn-sm{padding:4px 9px;font-size:12px}
:where(button,input,select,textarea,a,[tabindex]):focus-visible{outline:2px solid var(--info);outline-offset:2px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:7px;padding:7px 10px;font:400 13px 'Archivo',sans-serif}
.inp::placeholder{color:var(--faint)}
textarea.inp{min-height:70px;resize:vertical}
.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.b-crit{background:var(--critbg);color:var(--crit);border-color:rgba(255,99,88,.35)}
.b-warn{background:var(--warnbg);color:var(--warn);border-color:rgba(240,177,58,.35)}
.b-ok{background:var(--okbg);color:var(--ok);border-color:rgba(70,194,142,.35)}
.b-info{background:var(--infobg);color:var(--info);border-color:rgba(90,169,255,.35)}
.b-mute{background:rgba(138,157,178,.12);color:var(--muted);border-color:var(--line2)}
.tblwrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--panel2);white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--text)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:260px}
.tbl tbody tr:hover td{background:rgba(255,255,255,.025)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font:500 13.5px 'Archivo',sans-serif;cursor:pointer;text-align:left;white-space:nowrap}

.pix i.g{background:var(--warn)}.pix i.f{background:var(--crit)}
.overlay{position:fixed;inset:0;background:rgba(3,8,13,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay-side{justify-content:flex-end;padding:0}
.dialog{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.dialog.wide{max-width:760px}
.dialog.drawer{max-width:720px;height:100%;max-height:100%;border-radius:0;border-width:0 0 0 1px;padding-top:env(safe-area-inset-top,0px)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0;font-size:16px;font-weight:600}
.dlg-body{padding:18px;overflow:auto}
.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.55;white-space:pre;color:#c9d7e6;max-height:56vh}
.toasts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70;max-width:min(380px,calc(100vw - 28px))}
.toast{padding:10px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);border-left-width:4px;font-size:13px}
.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}.toast.info{border-left-color:var(--info)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:500;border:1px solid}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.pill.live{color:var(--ok);background:var(--okbg);border-color:rgba(70,194,142,.4)}
.pill.mock{color:var(--warn);background:var(--warnbg);border-color:rgba(240,177,58,.4)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}

.seg button.on{background:var(--info);color:#06121f}
.trace{border-left:3px solid var(--line2);padding:6px 10px;margin-bottom:6px;background:var(--bg);border-radius:0 6px 6px 0;font-size:13px}
.trace.in{border-left-color:var(--info)}.trace.ok{border-left-color:var(--ok)}.trace.warn{border-left-color:var(--warn)}.trace.crit{border-left-color:var(--crit)}
@media (max-width:1023px){.sidenav{display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}.sidenav .nav-btn{width:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script type="text/plain" id="gas-src">/**
 * Badvel ISP NOC - Google Sheets REST endpoint (Apps Script Web App)
 * Extensions > Apps Script > paste this file > Deploy > New deployment > Web app
 * Execute as: Me    Who has access: Anyone
 */
var SPREADSHEET_ID = '1qcx7IFXRUXE4yv-r6wYQ6MQR0X3T2fsxNQjSY3T2nIs'; // '' = use the bound spreadsheet
var TZ = 'Asia/Kolkata';

var TABS = {
  Users_DB: ['UserName','ClientType','Schedule','24/7','BackupPower','Latitude','Longitude','Zone','AlarmHysteresis'],
  Live_Feed: ['Timestamp','UserName','Event'],
  Alerts: ['Timestamp','Severity','Alert Type','Zone','User / Entity','Message'],
  Ongoing_Outages: ['Outage Start Time','Severity','Outage Type','Zone','User / Entity','Duration (Ongoing)','Status','Impact / Root Cause Assessment'],
  Critical_Outages_Audit: ['Incident ID','Outage Start Time','Recovery Time','Duration','Zone / Feeder','User / Entity','Outage Type','Resolution Category','Action Taken / Root Cause Details','Technician / Verified By','Audit Status'],
  Filtered_Events: ['Timestamp','UserName','Event','Zone / Sector','Filter Category','Reason for Filter','Subscriber Classification (Users_DB)'],
  Customer_Notes: ['Date / Timestamp','UserName','Customer Name / Contact','Complaint / Issue Reported','Resolution Taken / Action Details','Root Cause Category','Status'],
  Proposed_Modifications: ['UserName','FieldToModify','CurrentValue','ProposedValue','Reason / Evidence','Status','Implementation Notes']
};

function ss_(id) {
  var sid = id || SPREADSHEET_ID;
  return sid ? SpreadsheetApp.openById(sid) : SpreadsheetApp.getActiveSpreadsheet();
}
function out_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
function now_() { return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd HH:mm:ss'); }
function parse_(s) { return new Date(String(s).replace(' ', 'T') + '+05:30'); }
function dur_(ms) {
  var m = Math.max(0, Math.floor(ms / 60000));
  if (m < 1) return '<1m';
  var d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + ('0' + mm).slice(-2) + 'm';
  return mm + 'm';
}
function sheet_(book, name) {
  var sh = book.getSheetByName(name);
  if (!sh) { sh = book.insertSheet(name); sh.appendRow(TABS[name]); sh.setFrozenRows(1); }
  return sh;
}
function readTab_(book, name) {
  var v = sheet_(book, name).getDataRange().getDisplayValues();
  var headers = v[0], rows = [];
  for (var i = 1; i < v.length; i++) {
    if (v[i].join('') === '') continue;
    var o = {};
    for (var j = 0; j < headers.length; j++) o[headers[j]] = v[i][j];
    rows.push(o);
  }
  return { headers: headers, rows: rows };
}

/** GET  ?action=all            -> every tab
 *  GET  ?sheet=Users_DB        -> one tab
 *  Optional: &id=<spreadsheetId> */
function doGet(e) {
  try {
    var p = (e && e.parameter) || {};
    var book = ss_(p.id);
    if (p.sheet) {
      if (!TABS[p.sheet]) return out_({ ok: false, error: 'Unknown sheet: ' + p.sheet });
      var t = readTab_(book, p.sheet);
      return out_({ ok: true, sheet: p.sheet, headers: t.headers, rows: t.rows });
    }
    var all = {};
    for (var name in TABS) all[name] = readTab_(book, name);
    return out_({ ok: true, generatedAt: now_(), sheets: all });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  }
}

function appendRow_(book, name, row) {
  var sh = sheet_(book, name), headers = TABS[name];
  var vals = headers.map(function (h) { return row[h] !== undefined ? row[h] : ''; });
  var rng = sh.getRange(sh.getLastRow() + 1, 1, 1, headers.length);
  rng.setNumberFormat('@');          // keep timestamps as plain text
  rng.setValues([vals]);
}
function findRow_(sh, match) {
  var v = sh.getDataRange().getDisplayValues(), h = v[0];
  for (var i = 1; i < v.length; i++) {
    var ok = true;
    for (var k in match) {
      var c = h.indexOf(k);
      if (c < 0 || String(v[i][c]) !== String(match[k])) { ok = false; break; }
    }
    if (ok) return i + 1;
  }
  return -1;
}

function handle_(book, req) {
  if (req.action === 'append') {
    if (!TABS[req.sheet]) return { ok: false, error: 'Unknown sheet: ' + req.sheet };
    appendRow_(book, req.sheet, req.row || {});
    return { ok: true };
  }
  if (req.action === 'update') {
    if (!TABS[req.sheet]) return { ok: false, error: 'Unknown sheet: ' + req.sheet };
    var sh = sheet_(book, req.sheet), r = findRow_(sh, req.match || {});
    if (r < 0) return { ok: false, error: 'Row not found' };
    var headers = TABS[req.sheet];
    for (var k in req.set) {
      var c = headers.indexOf(k);
      if (c >= 0) { var cell = sh.getRange(r, c + 1); cell.setNumberFormat('@'); cell.setValue(req.set[k]); }
    }
    return { ok: true };
  }
  if (req.action === 'resolve') {
    var og = sheet_(book, 'Ongoing_Outages');
    var row = findRow_(og, { 'Outage Start Time': req.startTime, 'User / Entity': req.entity });
    if (row < 0) return { ok: false, error: 'Outage not found in Ongoing_Outages' };
    var v = og.getRange(row, 1, 1, 8).getDisplayValues()[0];
    var recovery = now_();
    var duration = dur_(parse_(recovery) - parse_(v[0]));
    var audit = sheet_(book, 'Critical_Outages_Audit');
    var id = 'INC-' + Utilities.formatDate(new Date(), TZ, 'yyyyMMdd') + '-' + ('00' + audit.getLastRow()).slice(-3);
    appendRow_(book, 'Critical_Outages_Audit', {
      'Incident ID': id, 'Outage Start Time': v[0], 'Recovery Time': recovery, 'Duration': duration,
      'Zone / Feeder': v[3], 'User / Entity': v[4], 'Outage Type': v[2],
      'Resolution Category': req.category || 'Action Taken',
      'Action Taken / Root Cause Details': req.actionTaken || '',
      'Technician / Verified By': req.technician || '',
      'Audit Status': 'Closed'
    });
    og.deleteRow(row);
    appendRow_(book, 'Live_Feed', { 'Timestamp': recovery, 'UserName': v[4], 'Event': 'CONNECTED' });
    return { ok: true, incidentId: id, recoveryTime: recovery, duration: duration };
  }
  return { ok: false, error: 'Unknown action: ' + req.action };
}

/** POST body (text/plain JSON):
 *  {action:'append', sheet, row:{...}}
 *  {action:'update', sheet, match:{col:val}, set:{col:val}}
 *  {action:'resolve', startTime, entity, category, actionTaken, technician}
 *  {action:'batch', ops:[ ...any of the above... ]}   Optional: id */
function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var req = JSON.parse(e.postData.contents);
    var book = ss_(req.id);
    if (req.action === 'batch') {
      var results = (req.ops || []).map(function (op) { return handle_(book, op); });
      return out_({ ok: results.every(function (r) { return r.ok; }), results: results });
    }
    return out_(handle_(book, req));
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}
</script>

/* ---------- time helpers (all sheet timestamps are IST) ---------- */
var IST_MS=330*60000;
function pad(n,l){return String(n).padStart(l||2,'0');}
function fmtTs(d){var x=new Date((d instanceof Date?d.getTime():d)+IST_MS);return x.getUTCFullYear()+'-'+pad(x.getUTCMonth()+1)+'-'+pad(x.getUTCDate())+' '+pad(x.getUTCHours())+':'+pad(x.getUTCMinutes())+':'+pad(x.getUTCSeconds());}
var MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};

function fmtDur(ms){ms=Math.max(0,ms);var m=Math.floor(ms/60000);if(m<1)return '<1m';var d=Math.floor(m/1440),hh=Math.floor((m%1440)/60),mm=m%60;if(d)return d+'d '+hh+'h';if(hh)return hh+'h '+pad(mm)+'m';return mm+'m';}

function runSim(P,users,nowMs,ongoingUsers){
  var zoneUsers=users.filter(function(u){return u.Zone===P.zone;});
  var ts=fmtTs(nowMs),trace=[],R={Live_Feed:[],Filtered_Events:[],Alerts:[],Ongoing_Outages:[],Critical_Outages_Audit:[]},reconnect=[];
  var node=users.filter(function(u){return u.UserName===P.node;})[0]||zoneUsers[0];
  function drop(u,t){R.Live_Feed.push({Timestamp:t||ts,UserName:u.UserName,Event:'DISCONNECTED'});}
  function filt(u,cat,reason){R.Filtered_Events.push({Timestamp:ts,UserName:u.UserName,Event:'DISCONNECTED','Zone / Sector':u.Zone,'Filter Category':cat,'Reason for Filter':reason,'Subscriber Classification (Users_DB)':classOf(u)});}
  function alert(sev,type,ent,msg){R.Alerts.push({Timestamp:ts,Severity:sev,'Alert Type':type,Zone:P.zone,'User / Entity':ent,Message:msg});}
  function outage(sev,type,ent,status,why){R.Ongoing_Outages.push({'Outage Start Time':ts,Severity:sev,'Outage Type':type,Zone:P.zone,'User / Entity':ent,'Duration (Ongoing)':'<1m',Status:status,'Impact / Root Cause Assessment':why});}
  if(P.mode==='grid'){
    if(P.scope==='zone'){
      var down=zoneUsers.filter(function(u){return u.BackupPower!=='Yes';}),held=zoneUsers.length-down.length;
      trace.push({kind:'in',text:down.length+' of '+zoneUsers.length+' nodes in '+P.zone+' sent DISCONNECTED within 45 seconds.'});
      trace.push({kind:'in',text:held+' nodes with backup power stayed connected.'});
      down.forEach(function(u){drop(u);filt(u,'Routine Power Cut','Unbacked node dropped together with its feeder neighbours. Grid trip, not a fiber fault.');});
      trace.push({kind:'ok',text:'Decision: feeder power cut. '+down.length+' disconnects silenced and written to Filtered_Events. No outage raised.'});
      if(down.length/zoneUsers.length>=0.6){alert('Warning','Area Blackout','Feeder neighbours',down.length+' of '+zoneUsers.length+' nodes dark; '+held+' backed-up nodes held.');trace.push({kind:'warn',text:'Area blackout alert logged to Alerts (counts toward the 24h blackout total).'});}
      else{alert('Info','Grid Trip Filtered','Feeder neighbours',down.length+' unbacked nodes dropped together and were silenced.');}
      reconnect=down;
    }else if(node.BackupPower==='Yes'){
      trace.push({kind:'ok',text:node.UserName+' has backup power, so a grid trip should not disconnect it. No event generated.'});
    }else{
      drop(node);filt(node,'Unbacked Node','Single home node without backup power dropped; treated as a premise power switch-off.');
      trace.push({kind:'in',text:node.UserName+' sent DISCONNECTED.'});
      trace.push({kind:'ok',text:'Decision: unbacked node, silenced and logged to Filtered_Events.'});
      reconnect=[node];
    }
  }else if(P.mode==='fiber'){
    if(P.scope==='zone'){
      trace.push({kind:'in',text:'All '+zoneUsers.length+' nodes in '+P.zone+' sent DISCONNECTED, including '+zoneUsers.filter(function(u){return u.BackupPower==='Yes';}).length+' with backup power.'});
      zoneUsers.forEach(function(u){drop(u);});
      trace.push({kind:'crit',text:'Decision: backed-up nodes cannot lose power with the feeder, so this is a physical fault upstream. Raising a critical trunk outage.'});
      outage('Critical','Fiber Cut - Zone Feeder Trunk','Feeder trunk: '+P.zone,'Simulated - investigating','Every node in the zone dropped, including backed-up 24/7 nodes. Trunk or splitter cut suspected.');
      alert('Critical','Fiber Cut Suspected','Feeder trunk: '+P.zone,'Whole zone offline including backed-up nodes.');
    }else{
      trace.push({kind:'in',text:node.UserName+' sent DISCONNECTED.'});
      var peers=zoneUsers.filter(function(u){return u.UserName!==node.UserName&&u.BackupPower!=='Yes';});
      trace.push({kind:'in',text:'Neighbour check: '+peers.length+' unbacked neighbours in the zone are still connected.'});
      if(node['24/7']!=='Yes'&&outsideSchedule(node.Schedule,nowMs)){
        drop(node);filt(node,'Out-of-Schedule','Dropped outside its '+node.Schedule+' window.');
        trace.push({kind:'ok',text:'Decision: outside the node schedule ('+node.Schedule+'). Silenced and logged to Filtered_Events.'});
      }else if(ongoingUsers[node.UserName]){
        trace.push({kind:'warn',text:node.UserName+' already has an open outage. No duplicate raised.'});
      }else{
        drop(node);
        var sev=node['24/7']==='Yes'?'Critical':(node.BackupPower==='Yes'?'Major':'Minor');
        trace.push({kind:'crit',text:'Decision: neighbours are up, so this is not a feeder power cut. Raising a '+sev+' outage.'});
        outage(sev,'Fiber Cut - Drop Cable',node.UserName,'Simulated - investigating','Node dropped while neighbours on the same feeder stayed online. Drop-side fiber fault suspected.');
        alert(sev==='Minor'?'Warning':sev==='Major'?'Warning':'Critical','Fiber Cut Suspected',node.UserName,'Isolated disconnect with healthy neighbours.');
      }
    }
  }else{
    var hy=Number(node.AlarmHysteresis)||5,b=Math.max(1,Number(P.bounce)||2);
    R.Live_Feed.push({Timestamp:fmtTs(nowMs-b*60000),UserName:node.UserName,Event:'DISCONNECTED'});
    R.Live_Feed.push({Timestamp:ts,UserName:node.UserName,Event:'CONNECTED'});
    trace.push({kind:'in',text:node.UserName+' disconnected and reconnected after '+b+' min. Its alarm hysteresis is '+hy+' min.'});
    if(b<hy){
      filt(node,'Hysteresis Buffered','Reconnected after '+b+' minutes, inside the '+hy+' minute hysteresis window.');
      trace.push({kind:'ok',text:'Decision: buffered. No alarm raised, event logged to Filtered_Events.'});
    }else{
      alert('Warning','Hysteresis Exceeded',node.UserName,'Drop lasted '+b+' min, longer than the '+hy+' min hysteresis window. Recovered by itself.');
      R.Critical_Outages_Audit.push({'Incident ID':'__ID__','Outage Start Time':fmtTs(nowMs-b*60000),'Recovery Time':ts,Duration:fmtDur(b*60000),'Zone / Feeder':node.Zone,'User / Entity':node.UserName,'Outage Type':'Flapping ('+b+'-min bounce)','Resolution Category':'Self-Healed','Action Taken / Root Cause Details':'Simulated bounce that outlasted hysteresis and recovered by itself.','Technician / Verified By':'Auto-verified','Audit Status':'Closed'});
      trace.push({kind:'warn',text:'Decision: bounce outlasted hysteresis. Alert raised and a self-healed incident written to the audit ledger.'});
    }
  }
  return {trace:trace,rows:R,reconnect:reconnect};
}

function runAudit(data){
  var users={};data.Users_DB.forEach(function(u){users[u.UserName]=u;});
  var ex=data.Proposed_Modifications;
  function has(u,f){return ex.some(function(r){return r.UserName===u&&r.FieldToModify===f&&r.Status!=='Rejected';});}
  var out=[],notes=[];
  var flap={};
  data.Critical_Outages_Audit.forEach(function(r){var s=parseTs(r['Outage Start Time']),e=parseTs(r['Recovery Time']);if(s&&e&&e-s<=5*60000){var u=r['User / Entity'];flap[u]=(flap[u]||0)+1;}});
  var by={};data.Live_Feed.forEach(function(f){(by[f.UserName]=by[f.UserName]||[]).push({t:parseTs(f.Timestamp),e:f.Event});});
  Object.keys(by).forEach(function(u){var ev=by[u].filter(function(x){return x.t;}).sort(function(a,b){return a.t-b.t;}),c=0;for(var i=0;i<ev.length-1;i++){if(ev[i].e==='DISCONNECTED'&&ev[i+1].e==='CONNECTED'&&ev[i+1].t-ev[i].t<=5*60000)c++;}if(c)flap[u]=(flap[u]||0)+c;});
  Object.keys(flap).forEach(function(u){
    var us=users[u];if(!us||flap[u]<2||Number(us.AlarmHysteresis)>=15||has(u,'AlarmHysteresis'))return;
    out.push({UserName:u,FieldToModify:'AlarmHysteresis',CurrentValue:us.AlarmHysteresis,ProposedValue:'15','Reason / Evidence':flap[u]+' bounces of 5 minutes or less across the audit ledger and live feed. A 15 minute buffer would have absorbed them.',Status:'Pending Review','Implementation Notes':''});
    notes.push('Flapping node: '+u+' ('+flap[u]+' short bounces) - suggest 15 min hysteresis.');
  });
  var bat={};
  data.Critical_Outages_Audit.forEach(function(r){if(/Backup Exhausted/i.test(r['Outage Type']))bat[r['User / Entity']]=(bat[r['User / Entity']]||0)+1;});
  data.Customer_Notes.forEach(function(r){if(/Battery/i.test(r['Root Cause Category']))bat[r.UserName]=(bat[r.UserName]||0)+1;});
  Object.keys(bat).forEach(function(u){
    var us=users[u];if(!us||bat[u]<2||us.BackupPower!=='Yes'||has(u,'BackupPower'))return;
    out.push({UserName:u,FieldToModify:'BackupPower',CurrentValue:'Yes',ProposedValue:'Degraded','Reason / Evidence':bat[u]+' battery signals (backup-exhausted incidents and technician notes). Backup runtime is shorter than the grid cuts it must cover.',Status:'Pending Review','Implementation Notes':''});
    notes.push('Battery degradation: '+u+' - flag backup power as degraded and schedule a replacement.');
  });
  var fz={};
  data.Critical_Outages_Audit.forEach(function(r){if(/^Fiber Cut/i.test(r['Outage Type']))fz[r['Zone / Feeder']]=(fz[r['Zone / Feeder']]||0)+1;});
  data.Ongoing_Outages.forEach(function(r){if(/^Fiber Cut/i.test(r['Outage Type']))fz[r.Zone]=(fz[r.Zone]||0)+1;});
  Object.keys(fz).forEach(function(z){
    var key='ZONE: '+z;if(fz[z]<2||has(key,'RouteHardening'))return;
    out.push({UserName:key,FieldToModify:'RouteHardening',CurrentValue:'Single physical path',ProposedValue:'Add diverse or underground path','Reason / Evidence':fz[z]+' fiber cuts in this zone (closed and open incidents). Repeated cuts on one path justify a protected route.',Status:'Pending Review','Implementation Notes':''});
    notes.push('Route hardening: '+z+' ('+fz[z]+' fiber cuts).');
  });
  return {proposals:out,notes:notes,stats:{audit:data.Critical_Outages_Audit.length,notes:data.Customer_Notes.length,feed:data.Live_Feed.length}};
}
